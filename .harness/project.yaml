apiVersion: harness.conda/project-v1
kind: HarnessProject
metadata:
  name: harness-conda
spec:
  agent: codex
  targets:
    - codex
    - claude
  base:
    - reproducibility-core
  profiles:
    research:
      description: Find prior work, collect evidence, and produce testable hypotheses.
      packages:
        - research-workflow
      handoff: optional
    experiment:
      description: Turn hypotheses into reproducible experiments, evaluate results, and record failures.
      packages:
        - experiment-workflow
      handoff: required
  bindings:
    build: npm run build
    test: npm test
  handoffDirectory: .harness/handoffs
