apiVersion: woma.dev/v1
kind: Woma
metadata:
  name: woma-project-memory
  version: 0.1.0
  description: Load and maintain durable project-specific knowledge for every Skill in an active Woma Environment.
  tags: [memory, project-context]
spec:
  platforms: [codex, claude, pi, qoder]
  entrypoints:
    - name: manage-project-memory
      skill: woma-project-memory
      description: Load relevant project knowledge and persist stable facts in the correct scope.
  skills:
    - name: woma-project-memory
      path: ./skills/woma-project-memory
