apiVersion: harness.conda/v1
kind: Harness
metadata:
  name: idea-gen
  version: 1.0.0
  description: Generate one evidence-grounded, falsifiable research idea.
  tags: [research, ideation]
spec:
  platforms: [codex, claude]
  entrypoints:
    - name: generate
      skill: idea-gen
      description: Generate one concrete idea with a falsification plan.
  skills:
    - name: idea-gen
      path: ./skills/idea-gen
