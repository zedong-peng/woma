apiVersion: harness.conda/v1
kind: Harness
metadata:
  name: exp-design
  version: 1.0.0
  description: Turn a research idea into a controlled, executable experiment specification.
  tags: [research, experiment]
spec:
  platforms: [codex, claude, pi]
  entrypoints:
    - name: design
      skill: exp-design
      description: Produce a controlled experiment and falsification specification.
  skills:
    - name: exp-design
      path: ./skills/exp-design
