apiVersion: harness.conda/v1
kind: Harness
metadata:
  name: performance-engineering
  version: 0.2.0
  description: Evidence-first benchmark, profile, optimize, and regression-report loop for existing software.
  tags: [performance, benchmark, profiling]
spec:
  platforms: [codex, claude]
  requirements:
    env: []
    commands: [git, node]
    bindings:
      - name: test
        description: Correctness command that must remain green before and after optimization.
      - name: benchmark
        description: Repeatable command that emits the primary performance metric.
  skills:
    - name: performance-loop
      path: ./skills/performance-loop
  mcpServers: []
  hooks:
    - event: PostToolUse
      matcher: Edit|Write
      command: git diff --check
      timeout: 10
